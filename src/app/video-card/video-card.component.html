<button type="button" class="block w-full text-left active:opacity-70" (click)="chosen.emit()">
  <div class="relative overflow-hidden rounded-2xl bg-white/5">
    <img [src]="video().thumbnailUrl" alt="" loading="lazy" class="aspect-video w-full object-cover" [class.opacity-50]="watched()" />
    <span class="absolute bottom-2 right-2 rounded-lg bg-black/80 px-2 py-0.5 text-base font-semibold">
      {{ formatDuration(video().durationSeconds) }}
    </span>
    @if (watched()) {
      <span class="absolute left-2 top-2 rounded-lg bg-black/80 px-2 py-0.5 text-base">Đã xem</span>
    }
  </div>
  <p class="mt-2 line-clamp-2 text-xl font-semibold leading-snug">{{ video().title }}</p>
  <p class="mt-1 text-lg text-white/60">
    @if (showChannel()) {
      {{ video().channelTitle }} ·
    }
    {{ relativeTime(video().publishedAt) }}
  </p>
</button>
